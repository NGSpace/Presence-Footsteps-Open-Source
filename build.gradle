buildscript {
    dependencies {
        classpath 'com.github.dexman545:Outlet:1.6.1'
    }
}
plugins {
    id "net.fabricmc.fabric-loom" version "1.15-SNAPSHOT"
    id 'maven-publish'
    id 'org.ajoberstar.reckon' version '0.13.1'
}
apply plugin: 'io.github.dexman545.outlet'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

group = project.group

base {
    archivesName = project.name
}

reckon {
    scopeFromProp()
    stageFromProp('beta', 'rc', 'final')
}

outlet {
    allowSnapshotsForProject = true
    mcVersionRange = project.minecraft_version_range
}

System.out.println "Outlet MC Versions: ${outlet.mcVersions()}"

repositories {
    flatDir { dirs 'lib' }
    mavenLocal()
    maven { name 'modmenu'; url 'https://maven.terraformersmc.com/releases' }
    maven {name 'Xander Maven'; url 'https://maven.isxander.dev/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    api "net.fabricmc:fabric-loader:${project.loader_version}"

    api fabricApi.module("fabric-api-base", project.fabric_version)
    api fabricApi.module("fabric-lifecycle-events-v1", project.fabric_version)
    api fabricApi.module("fabric-key-mapping-api-v1", project.fabric_version)
    api fabricApi.module("fabric-screen-api-v1", project.fabric_version)
    api fabricApi.module("fabric-resource-loader-v0", project.fabric_version)
    api fabricApi.module("fabric-block-api-v1", project.fabric_version)
    api fabricApi.module("fabric-transitive-access-wideners-v1", project.fabric_version)

    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version.toString()

    filesMatching("fabric.mod.json") {
        expand "version": project.version.toString(),
                "minecraftVersion": project.minecraft_version_range,
                "loaderVersion": ">=${project.loader_version}",
                "fabricVersion": ">=${project.fabric_version}",
                "yaclVersion": ">=${project.yacl_version}",
                "modmenuVersion": ">=${project.modmenu_version}",
                "name": "${project.displayname}",
                "description": "${project.description}"
    }

    from 'LICENSE'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}
