name: Encrypt Secret Key

on:
  # This allows you to run the workflow manually from the "Actions" tab
  workflow_dispatch:

jobs:
  encrypt-task:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt the secret
        env:
          # We map the secrets to environment variables for use in the script
          TARGET_SECRET: ${{ secrets.MODRINTH_KEY }}
          PASSWORD: ${{ secrets.SECRET_PASSWORD }}
        run: |
          # 1. Save the secret to a temporary file
          # We use a heredoc to handle potential special characters/newlines
          cat <<EOF > plain_secret.txt
          $TARGET_SECRET
          EOF

          # 2. Encrypt the file using OpenSSL
          # -aes-256-cbc: The encryption algorithm
          # -salt: Adds a random salt to the key derivation
          # -pbkdf2: Uses a modern key derivation function
          # -pass env:PASSWORD: Uses the environment variable as the encryption password
          openssl enc -aes-256-cbc -salt -pbkdf2 -in plain_secret.txt -out encrypted.bin -pass env:PASSWORD

          # 3. Convert the binary file to Base64 so it can be handled as text easily
          base64 encrypted.bin > encrypted_key.txt

          # 4. Clean up the unencrypted file immediately
          rm plain_secret.txt

      - name: Upload Encrypted File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-modrinth-key
          path: encrypted_key.txt

      - name: Print Encrypted String (Optional)
        run: |
          echo "Your encrypted key (Base64) is:"
          cat encrypted_key.txt
